<!doctype html>
<html lang="zh-CN" data-theme="bocchi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>拼豆 PinDou · 拼豆图纸创作工坊</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // 首屏主题防闪烁：在首帧绘制前按 localStorage（zustand persist，键 pindou-theme）恢复偏好。
      // 预渲染产物默认 bocchi 亮色；挂载后由 ThemeController 接管，两端取值口径一致。
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('pindou-theme') || 'null')
          var state = saved && saved.state ? saved.state : {}
          var root = document.documentElement
          root.dataset.theme = state.accent === 'miku' ? 'miku' : 'bocchi'
          root.classList.toggle('dark', state.dark === true)
        } catch (e) {
          /* 解析失败保持默认 */
        }
      })()
    </script>
    <!--
      meta/OG 由路由层统一注入：
      - 预渲染营销页（/、/about）由 scripts/prerender.mjs 在构建时写入 head；
      - CSR 路由由 src/components/Seo.tsx 在客户端按路由 upsert。
      模板里不放 description/OG，避免重复标签。
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
